name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    runs-on: macos-26
    strategy:
      matrix:
        xcode: ["26.3"]
        config: ["debug", "release"]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
      - name: Install validation dependencies
        run: npm install
        working-directory: validation
      - name: Run ${{ matrix.config }} tests
        run: swift test --configuration ${{ matrix.config }} --disable-experimental-prebuilts

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependencies
        run: npm install
        working-directory: validation
      - name: "Test Swift Package on Linux"
        run: swift test --disable-experimental-prebuilts

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Test Swift Package on Android"
        uses: swift-android-sdk/swift-android-action@v2
        with:
          swift-version: 6.2.3
          swift-build-flags: --disable-experimental-prebuilts
          run-tests: false # NB: Emulator seems to take too long to boot

  wasm:
    name: Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift 6.2.3
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.2.3"
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: Install Swift SDK for WebAssembly
        run: |
          set -ex
          swift sdk install https://download.swift.org/swift-6.2.3-release/wasm-sdk/swift-6.2.3-RELEASE/swift-6.2.3-RELEASE_wasm.artifactbundle.tar.gz --checksum 394040ecd5260e68bb02f6c20aeede733b9b90702c2204e178f3e42413edad2a
      - name: Build Swift Package for WebAssembly
        run: swift build --swift-sdk swift-6.2.3-RELEASE_wasm --target StructuredCFG -Xlinker -z -Xlinker stack-size=$((1024 * 1024))

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Setup Swift on Windows"
        uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.2.3-release
          tag: 6.2.3-RELEASE
      - name: Install validation dependencies
        run: npm install
        working-directory: validation
      - name: "Test Swift Package on Windows"
        run: swift test --disable-experimental-prebuilts
